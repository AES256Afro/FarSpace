name: Container image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Verify release tag matches package.json
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v${{ steps.version.outputs.value }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/aes256afro/farspace:${{ steps.version.outputs.value }}
            ghcr.io/aes256afro/farspace:sha-${{ github.sha }}
          build-args: |
            FARSPACE_REVISION=${{ github.sha }}
            FARSPACE_VERSION=${{ steps.version.outputs.value }}
